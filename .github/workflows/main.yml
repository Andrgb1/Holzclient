name: Build HolzClient

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle (use wrapper if present, otherwise install Gradle)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            echo "No gradlew found — installing gradle via apt"
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle build --no-daemon --stacktrace
          fi

      - name: Show generated files
        run: |
          echo "--- build directory ---"
          ls -la build || echo "no build dir"
          echo "--- build/libs directory ---"
          ls -la build/libs || echo "no build/libs dir"
          echo "--- find jars ---"
          find build -type f -name "*.jar" -print || true

      - name: Upload build folder as artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: holzclient-build
          path: build/**
